<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New Tab</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <!--
      The stylesheet, split by concern: tokens.css holds the tunables, base.css
      the page shell, motion.css the keyframes, and the rest each own one block
      of the page. Linked rather than bundled because the project has no build
      step, and linked individually rather than through @import because that
      would serialise the loads.

      Order matters in one place only: motion.css carries the reduced-motion
      overrides, so it has to come after the rules they override.
    -->
    <link rel="stylesheet" href="style/tokens.css" />
    <link rel="stylesheet" href="style/fonts.css" />
    <link rel="stylesheet" href="style/base.css" />
    <link rel="stylesheet" href="style/clock.css" />
    <link rel="stylesheet" href="style/phrase.css" />
    <link rel="stylesheet" href="style/quote.css" />
    <link rel="stylesheet" href="style/fullscreen.css" />
    <link rel="stylesheet" href="style/motion.css" />
    <!--
      type="module" implies defer, so the DOM is parsed before main.js runs.
      A module script is required rather than an inline one: the Manifest V3
      default CSP is "script-src 'self'; object-src 'self'", which forbids
      inline JavaScript.
    -->
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <!-- Background photo and scrim. Purely decorative. -->
    <div class="bg" aria-hidden="true"></div>

    <!--
      Each .slot is positioned independently against the viewport height; see
      the layout block in style/base.css. Keeping them as siblings rather than as
      one stacked column is what lets the phrase sit dead centre while the
      quote sits between it and the bottom edge.
    -->
    <main class="stage">
      <div class="slot slot--head">
        <div class="clock" id="clock">--:--:--.-</div>
        <p class="date" id="date"></p>
      </div>

      <p class="slot slot--phrase" id="phrase"></p>

      <figure class="slot slot--quote">
        <blockquote class="quote__content" id="quote-content"></blockquote>
        <figcaption class="quote__author" id="quote-author"></figcaption>
      </figure>
    </main>

    <!--
      Fullscreen toggle, parked in the bottom-right corner. The wrapper is not
      decoration: it is the zone the pointer has to enter for the button to fade
      in, and it is deliberately much larger than the icon. See
      style/fullscreen.css, which is also where both icons come from.

      js/fullscreen.js rewrites the label as the state changes; the one here is
      the pre-script default for the same string.
    -->
    <div class="fullscreen">
      <button
        class="fullscreen__button"
        id="fullscreen"
        type="button"
        aria-label="Enter fullscreen"
      ></button>
    </div>
  </body>
</html>
